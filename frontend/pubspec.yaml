  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  socket_io_client: ^3.1.2
  path_provider: ^2.1.5
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.25.0

flutter:
  uses-material-design: true
